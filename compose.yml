services:
  rss-hub:
    image: ghcr.io/nchungdev/rss-hub:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rss-hub
    restart: unless-stopped
    ports:
      - "8098:8098"
    environment:
      - BASE_URL=https://rss.data1box.win
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - RSSHUB_UPSTREAM=http://rsshub-core:1200
      - SCRAPE_INTERVAL_MINUTES=30
    volumes:
      - /appdata/rss-hub/data:/app/data
      - /appdata/rss-hub/config:/app/config
    networks:
      - clara_net
      - default

  rsshub-core:
    image: diygod/rsshub:latest
    container_name: rsshub-core
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CACHE_TYPE=memory
    networks:
      - clara_net
      - default

networks:
  clara_net:
    external: true
